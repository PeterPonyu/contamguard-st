[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contamguard-st"
version = "0.1.0"
description = "Independent synthetic contamination and control-channel QC scaffold"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
contamguard-st = "contamguard_st.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
